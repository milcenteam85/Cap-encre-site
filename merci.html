<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Message reçu — Cap Encre</title>
<style>
:root{--ink:#0f0f0d;--paper:#f3f0e8;--red:#e8482b;--grey:#6d6d63;--line:#d6d1c4}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.55 "Helvetica Neue",Helvetica,Arial,sans-serif;display:flex;min-height:100vh;align-items:center}
.w{max-width:640px;margin:0 auto;padding:40px 24px}
.k{display:inline-flex;align-items:center;gap:8px;font-size:11.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--red);font-weight:700;margin-bottom:22px}
h1{font-size:clamp(30px,5vw,52px);font-weight:800;letter-spacing:-.035em;line-height:1.05;margin:0 0 18px}
p{color:var(--grey);font-size:16.5px;margin:0 0 14px;max-width:46ch}
a{display:inline-block;margin-top:18px;background:var(--ink);color:var(--paper);text-decoration:none;padding:13px 22px;border-radius:4px;font-size:14.5px;font-weight:600}
a:hover{background:var(--red)}
</style>
</head>
<body>
<div class="w">
  <div class="k">Cap Encre</div>
  <h1>Message reçu.</h1>
  <p>Merci — on revient vers vous sous 48 heures, au numéro ou à l'adresse que vous avez indiqués.</p>
  <p>Si c'est urgent, appelez directement.</p>
  <a href="/">Retour à l'accueil</a>
</div>
</body>
</html>
